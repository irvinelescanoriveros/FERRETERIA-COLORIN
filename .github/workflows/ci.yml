name: CI - Pruebas y cobertura

# Se ejecuta en cada push a main/develop y en cada Pull Request hacia main.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Ejecutar pruebas (JUnit 5 + Mockito) y generar cobertura (JaCoCo)
        run: mvn -B test

      - name: Publicar informes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-pruebas
          path: |
            target/surefire-reports
            target/site/jacoco

      - name: Empaquetar JAR ejecutable
        run: mvn -B -DskipTests package

      - name: Publicar el JAR ejecutable
        uses: actions/upload-artifact@v7
        with:
          name: ferreteria-colorin-jar
          path: target/ferreteria-colorin.jar

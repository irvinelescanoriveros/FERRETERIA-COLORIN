# Despliegue completo con un comando (desde la carpeta deploy/):
#   cp .env.example .env   (editar claves)
#   docker compose up -d --build
# MySQL + backend web (http://localhost:8080). El escritorio se conecta a localhost:3306.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_APP_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
      - ../database/01_creacion_bd.sql:/docker-entrypoint-initdb.d/01_creacion_bd.sql:ro
      - ../database/02_tablas.sql:/docker-entrypoint-initdb.d/02_tablas.sql:ro
      - ../database/03_datos_iniciales.sql:/docker-entrypoint-initdb.d/03_datos_iniciales.sql:ro
      - ./crear-usuario-app.sh:/docker-entrypoint-initdb.d/99_crear_usuario_app.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../../backend-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bd_colorin
      DB_USERNAME: colorin_app
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  datos_mysql:
